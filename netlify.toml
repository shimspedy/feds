[build]
  command = "npm run build"
  publish = "public"

[[redirects]]
  from = "/state/*"
  to = "/state"
  status = 200

[[redirects]]
  from = "/leostate/*"
  to = "/leostate"
  status = 200

[[redirects]]
  from = "/leopay/*"
  to = "/leopay"
  status = 200

[[redirects]]
  from = "/gs/*"
  to = "/gs"
  status = 200

[[redirects]]
  from = "/leo/*"
  to = "/leo"
  status = 200

[[redirects]]
  from = "/wildlandpay/*"
  to = "/wildlandpay"
  status = 200

[[redirects]]
  from = "/wildland/*"
  to = "/wildland"
  status = 200

# Bandwidth protection: block abusive crawlers before static assets are served.
[[edge_functions]]
function = "block-abusive-bots"
path = "/*"

# Bandwidth protection: cache image assets aggressively.
[[headers]]
for = "/*.jpg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpeg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.webp"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.gif"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.ico"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
